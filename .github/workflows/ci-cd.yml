name: CI/CD - Deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build & Test Backend (Spring Boot)
  # ──────────────────────────────────────────────
  backend-build:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean verify --batch-mode --no-transfer-progress

  # ──────────────────────────────────────────────
  # Job 2: Build & Test Frontend (React + Vite)
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────────
  # Job 3: Validate Render Deploy Hooks (prod)
  # ──────────────────────────────────────────────
  validate-render-hooks:
    name: Validate Render Deploy Hooks
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check backend deploy hook secret
        run: |
          if [ -z "${{ secrets['RENDER_BACKEND_DEPLOY_HOOK_URL'] }}" ]; then
            echo "RENDER_BACKEND_DEPLOY_HOOK_URL is missing"
            exit 1
          fi

      - name: Check frontend deploy hook secret
        run: |
          if [ -z "${{ secrets['RENDER_FRONTEND_DEPLOY_HOOK_URL'] }}" ]; then
            echo "RENDER_FRONTEND_DEPLOY_HOOK_URL is missing"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # Job 4: Deploy Frontend to Render (prod)
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Render
    runs-on: ubuntu-latest
    needs: [validate-render-hooks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Frontend Deploy
        run: |
          curl -fsS -X POST "${{ secrets['RENDER_FRONTEND_DEPLOY_HOOK_URL'] }}"
          echo "Frontend Render deploy triggered"

  # ──────────────────────────────────────────────
  # Job 5: Deploy Backend to Render (prod)
  # ──────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [validate-render-hooks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -fsS -X POST "${{ secrets['RENDER_BACKEND_DEPLOY_HOOK_URL'] }}"
          echo "Backend Render deploy triggered"
