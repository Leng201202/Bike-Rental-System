server:
  port: ${PORT:8080}

spring:
  application:
    name: bike-rental-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_JDBC_URL:${DB_URL:jdbc:postgresql://localhost:5432/bike_rental}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DATABASE_USER:${PGUSER:postgres}}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DATABASE_PASSWORD:${PGPASSWORD:}}}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO

app:
  auth:
    jwt-secret: ${JWT_SECRET:change-this-in-production-with-a-long-random-secret}
    jwt-ttl-hours: ${JWT_TTL_HOURS:24}
